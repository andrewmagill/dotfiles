# Starship prompt — https://starship.rs/config/
# Edits take effect in the next shell. Explore presets with:
#   starship preset --list
#   starship preset plain-text-symbols -o ~/.config/starship.toml   # no glyphs
#
# Symbols are plain text (no Nerd Font glyphs) so they render in any font,
# including Sono. The prompt char is › (U+203A), which Sono includes.

add_newline = true
palette = "seashells"

format = """
$directory\
$git_branch$git_status\
$dotnet$nodejs\
$aws$azure\
$character"""

# Palette ported from the Alacritty "SeaShells" scheme (common/.config/alacritty).
[palettes.seashells]
bg     = "#09141b"
fg     = "#deb88d"
red    = "#d15123"
orange = "#fca02f"
green  = "#027c9b"   # SeaShells "green" is a teal
cyan   = "#50a3b5"
blue   = "#68d4f1"
sky    = "#1bbcdd"
sand   = "#fee4ce"
teal   = "#17384c"

[character]
success_symbol = "[›](green)"
error_symbol = "[›](red)"

[directory]
style = "bold blue"
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = ""           # icon-free; the bold orange color marks it as the branch
style = "bold orange"

# Sono lacks the arrow glyphs, so override git_status's default ⇡⇣⇕✘ with ASCII.
[git_status]
ahead    = ">"
behind   = "<"
diverged = "<>"
deleted  = "x"

# Language/context modules — plain-text symbols instead of Nerd Font glyphs.
[dotnet]
symbol = ".NET "

[nodejs]
symbol = "node "

[aws]
symbol = "aws "

[azure]
symbol = "az "
