# kitty configuration.
# Font + SeaShells colors ported from the Alacritty config
# (common/.config/alacritty/alacritty.toml) to keep a consistent look.

# --- Font ---
font_family      OpenDyslexicM Nerd Font Mono
font_size        12.0

# --- Window ---
window_padding_width 6

# --- SeaShells colors ---
foreground            #deb88d
background            #09141b
cursor                #fca02f
cursor_text_color     #08131a
selection_foreground  #fee4ce
selection_background  #1e4962

# normal
color0  #17384c
color1  #d15123
color2  #027c9b
color3  #fca02f
color4  #1e4950
color5  #68d4f1
color6  #50a3b5
color7  #deb88d

# bright
color8  #434b53
color9  #d48678
color10 #628d98
color11 #fdd39f
color12 #1bbcdd
color13 #bbe3ee
color14 #87acb4
color15 #fee4ce
