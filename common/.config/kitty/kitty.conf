# kitty configuration.
# Font + SeaShells colors ported from the Alacritty config
# (common/.config/alacritty/alacritty.toml) to keep a consistent look.

# --- Font ---
font_family      Sono
# Sono-Bold is heavy/muddy at small sizes on a dark bg; the lighter SemiBold reads cleaner.
bold_font        Sono SemiBold
font_size        14.0

# --- Window ---
window_padding_width 6

# --- SeaShells colors ---
foreground            #deb88d
background            #09141b
cursor                #fca02f
cursor_text_color     #08131a
selection_foreground  #fee4ce
selection_background  #1e4962

# normal
color0  #17384c
color1  #d15123
color2  #027c9b
color3  #fca02f
color4  #1e4950
color5  #68d4f1
color6  #50a3b5
color7  #deb88d

# bright
color8  #434b53
color9  #d48678
color10 #628d98
color11 #fdd39f
color12 #1bbcdd
color13 #bbe3ee
color14 #87acb4
color15 #fee4ce

# --- Per-machine overrides ---
# font_size (and modify_font) depend on each display's DPI, so a single shared
# value can't be right everywhere. Put them in an untracked, gitignored file:
#   ~/.config/kitty/kitty.local.conf   e.g. `font_size 15` on the Mac.
# globinclude is silent when the file is absent (unlike `include`); values here
# win because it loads last.
globinclude kitty.local.conf
